[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lignocellulosic-ethanol-opensource"
version = "0.1.0"
description = "Open-source conceptual sizing tools for a 2G cellulosic fuel-ethanol biorefinery (pretreatment, enzymatic hydrolysis, C5+C6 co-fermentation, distillation, dehydration)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "CoolProp>=6.6",
    "streamlit>=1.32",
    "plotly>=5.20",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["lignocellulosic_ethanol*"]
